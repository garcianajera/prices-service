spring.application.name=prices-service

# No fixed datasource URL: Spring Boot creates a uniquely named in-memory H2 database per context,
# so several test contexts never re-run schema.sql against the same database.
spring.sql.init.mode=embedded
# The schema comes from schema.sql, never from Hibernate (ADR-0004).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# The H2 console module is a developmentOnly dependency: available with bootRun, absent from tests and the jar.
spring.h2.console.enabled=true

# Swagger UI shows the hand-written contract (ADR-0007). springdoc can't turn off its generated spec without
# also removing the UI, so the generated one is restricted to no paths: it would contradict the contract
# (it declares applicationDate as date-time, which allows offsets and fractional seconds).
springdoc.swagger-ui.url=/openapi.yaml
springdoc.paths-to-match=/none
